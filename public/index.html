<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yarvis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; height: 100dvh; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #e0f7ff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .stars {
      position: fixed; inset: 0;
      background:
        radial-gradient(1px 1px at 20% 30%, #fff, transparent),
        radial-gradient(1px 1px at 60% 70%, #fff, transparent),
        radial-gradient(1px 1px at 80% 20%, #aef, transparent),
        radial-gradient(1px 1px at 40% 80%, #fff, transparent);
      background-size: 200px 200px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }
    header {
      position: relative; z-index: 2;
      padding: 10px 14px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 200, 255, 0.15);
      background: rgba(0, 10, 20, 0.8);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.05rem;
      letter-spacing: 0.15em;
      color: #7df9ff;
    }
    header span {
      display: block;
      font-size: 0.68rem;
      color: #5a9aaa;
      margin-top: 2px;
    }
    .core-wrap {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .core {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e0ffff, #00d4ff 40%, #0066aa 70%, #001428);
      box-shadow: 0 0 16px #00e5ff, 0 0 32px #00aaff, 0 0 50px rgba(0,180,255,0.4);
      animation: pulse 2.5s ease-in-out infinite;
      position: relative;
    }
    .core::before {
      content: '';
      position: absolute; inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(0,220,255,0.35);
      animation: ring 3s linear infinite;
    }
    .core.listening {
      box-shadow: 0 0 24px #00ffcc, 0 0 48px #00ffaa;
      animation: pulse-fast 0.8s ease-in-out infinite;
    }
    .core.thinking {
      box-shadow: 0 0 24px #ffaa00, 0 0 48px #ff8800;
    }
    .core.speaking {
      box-shadow: 0 0 24px #7c5cff, 0 0 48px #5a3fff;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .status {
      text-align: center;
      font-size: 0.72rem;
      color: #5a9aaa;
      padding: 2px 8px 6px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    #chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 8px 12px 130px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 2;
    }
    .msg {
      max-width: 92%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      flex-shrink: 0;
    }
    .msg.user {
      align-self: flex-end;
      background: rgba(0,100,160,0.4);
      border: 1px solid rgba(0,200,255,0.25);
    }
    .msg.bot {
      align-self: flex-start;
      background: rgba(0,40,60,0.75);
      border: 1px solid rgba(0,180,255,0.2);
    }
    .msg .agent {
      display: block;
      font-size: 0.68rem;
      color: #7df9ff;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }
    .fuentes {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(0,180,255,0.2);
      font-size: 0.75rem;
    }
    .fuentes a {
      display: block;
      color: #7df9ff;
      text-decoration: none;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .fuentes a:hover { text-decoration: underline; }
    .bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      padding: 8px 10px calc(12px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(transparent, rgba(0,8,16,0.98) 20%);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #input {
      flex: 1;
      background: rgba(0,30,50,0.9);
      border: 1px solid rgba(0,200,255,0.3);
      border-radius: 22px;
      padding: 11px 14px;
      color: #e0f7ff;
      font-size: 0.92rem;
      outline: none;
    }
    #input::placeholder { color: #4a7a8a; }
    button.icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    button.icon:active { transform: scale(0.92); }
    #btnSend {
      background: linear-gradient(145deg, #00b4e6, #0077aa);
      color: #fff;
    }
    #btnMic {
      background: linear-gradient(145deg, #00c9a0, #008866);
      color: #fff;
    }
    #btnMic.recording {
      background: linear-gradient(145deg, #ff4466, #cc2244);
      animation: pulse-fast 0.7s ease-in-out infinite;
    }
    #btnImg {
      background: linear-gradient(145deg, #7c5cff, #5a3fff);
      color: #fff;
    }
    #fileImg { display: none; }
    .hints {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      padding: 0 10px 6px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .hint {
      flex-shrink: 0;
      font-size: 0.68rem;
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0,180,255,0.25);
      background: rgba(0,40,60,0.5);
      color: #8ec8d8;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <header>
    <h1>YARVIS</h1>
    <span id="estadoLabel">CALMADO</span>
  </header>

  <div class="core-wrap">
    <div class="core" id="core"></div>
  </div>

  <div class="status" id="status">Listo</div>

  <div class="hints">
    <span class="hint" data-cmd="/resumen">/resumen</span>
    <span class="hint" data-cmd="/atlas "> /atlas</span>
    <span class="hint" data-cmd="/code "> /code</span>
    <span class="hint" data-cmd="/nova "> /nova</span>
    <span class="hint" data-cmd="/lumen "> /lumen</span>
    <span class="hint" data-cmd="/formal "> /formal</span>
    <span class="hint" data-cmd="/casual "> /casual</span>
  </div>

  <div id="chat"></div>

  <div class="bar">
    <button class="icon" id="btnMic" type="button" title="Hablar">🎤</button>
    <button class="icon" id="btnImg" type="button" title="Imagen">🖼️</button>
    <input id="fileImg" type="file" accept="image/*" />
    <input id="input" type="text" placeholder="Escribe o habla..." autocomplete="off" />
    <button class="icon" id="btnSend" type="button" title="Enviar">➤</button>
  </div>

  <script>
    var chat = document.getElementById('chat');
    var input = document.getElementById('input');
    var btnSend = document.getElementById('btnSend');
    var btnMic = document.getElementById('btnMic');
    var btnImg = document.getElementById('btnImg');
    var fileImg = document.getElementById('fileImg');
    var core = document.getElementById('core');
    var statusEl = document.getElementById('status');
    var estadoLabel = document.getElementById('estadoLabel');

    var sid = localStorage.getItem('yarvis_sid');
    if (!sid) {
      sid = Date.now() + '_' + Math.random().toString(36).slice(2);
      localStorage.setItem('yarvis_sid', sid);
    }
    var sessionId = 'web_' + sid;

    function setEstado(nombre, clase) {
      estadoLabel.textContent = nombre;
      core.classList.remove('listening', 'thinking', 'speaking');
      if (clase) core.classList.add(clase);
      statusEl.textContent = nombre;
    }

    function addMsg(text, who, agentName, fuentes) {
      var div = document.createElement('div');
      div.className = 'msg ' + who;
      if (agentName && who === 'bot') {
        var ag = document.createElement('span');
        ag.className = 'agent';
        ag.textContent = agentName;
        div.appendChild(ag);
      }
      div.appendChild(document.createTextNode(text));

      if (fuentes && fuentes.length) {
        var box = document.createElement('div');
        box.className = 'fuentes';
        box.appendChild(document.createTextNode('Fuentes:'));
        fuentes.forEach(function(f, i) {
          var a = document.createElement('a');
          a.href = f.url || '#';
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = (i + 1) + '. ' + (f.titulo || f.url || 'Fuente');
          box.appendChild(a);
        });
        div.appendChild(box);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function parseAgent(respuesta) {
      var m = (respuesta || '').match(/^([A-Za-zÁÉÍÓÚáéíóúñÑ]+):\s*\n\n?([\s\S]*)$/);
      if (m) return { agent: m[1], text: m[2].trim() };
      return { agent: 'Yarvis', text: respuesta || '' };
    }

    async function enviar(texto, imagen, mimeType) {
      if ((!texto || !texto.trim()) && !imagen) return;
      texto = (texto || '').trim();
      if (texto) addMsg(texto, 'user');
      if (imagen) addMsg('[Imagen enviada]', 'user');

      input.value = '';
      setEstado('PROCESANDO', 'thinking');

      try {
        var body = {
          mensaje: texto || '',
          sessionId: sessionId,
          userId: 'default'
        };
        if (imagen && mimeType) {
          body.imagen = imagen;
          body.mimeType = mimeType;
        }

        var res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');

        var parsed = parseAgent(data.respuesta || '');
        var agente = data.agente || parsed.agent;
        addMsg(parsed.text, 'bot', agente, data.fuentes || []);
        setEstado('HABLANDO', 'speaking');
        await hablar(parsed.text);
        setEstado('CALMADO', null);
      } catch (e) {
        addMsg('Error: ' + e.message, 'bot', 'Sistema');
        setEstado('CALMADO', null);
      }
    }

    async function hablar(texto) {
      if (!texto) return;
      try {
        var res = await fetch('/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto: texto.slice(0, 800) })
        });
        if (!res.ok) return;
        var blob = await res.blob();
        var url = URL.createObjectURL(blob);
        var audio = new Audio(url);
        await new Promise(function(resolve) {
          audio.onended = function() {
            URL.revokeObjectURL(url);
            resolve();
          };
          audio.onerror = resolve;
          audio.play().catch(resolve);
        });
      } catch (e) {}
    }

    btnSend.addEventListener('click', function() {
      enviar(input.value);
    });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') enviar(input.value);
    });

    document.querySelectorAll('.hint').forEach(function(el) {
      el.addEventListener('click', function() {
        input.value = el.getAttribute('data-cmd') || '';
        input.focus();
      });
    });

    // Imagen
    btnImg.addEventListener('click', function() {
      fileImg.click();
    });
    fileImg.addEventListener('change', function() {
      var file = fileImg.files && fileImg.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        var result = reader.result || '';
        var parts = result.split(',');
        var base64 = parts[1] || '';
        var mime = file.type || 'image/jpeg';
        var texto = input.value.trim() || 'Que ves en esta imagen?';
        enviar(texto, base64, mime);
        fileImg.value = '';
      };
      reader.readAsDataURL(file);
    });

    // Microfono
    var mediaRecorder = null;
    var chunks = [];
    var recording = false;

    btnMic.addEventListener('click', async function() {
      if (recording) {
        stopRec();
        return;
      }
      try {
        var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function(e) {
          if (e.data.size > 0) chunks.push(e.data);
        };
        mediaRecorder.onstop = async function() {
          stream.getTracks().forEach(function(t) { t.stop(); });
          var blob = new Blob(chunks, { type: 'audio/webm' });
          await transcribir(blob);
        };
        mediaRecorder.start();
        recording = true;
        btnMic.classList.add('recording');
        setEstado('ESCUCHANDO', 'listening');
      } catch (e) {
        alert('Permite el microfono en el navegador.');
        setEstado('CALMADO', null);
      }
    });

    function stopRec() {
      if (mediaRecorder && recording) {
        mediaRecorder.stop();
        recording = false;
        btnMic.classList.remove('recording');
        setEstado('PROCESANDO', 'thinking');
      }
    }

    async function transcribir(blob) {
      try {
        var reader = new FileReader();
        var base64 = await new Promise(function(resolve, reject) {
          reader.onload = function() {
            var s = reader.result;
            resolve(s.split(',')[1] || s);
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });

        var res = await fetch('/transcribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ audio: base64, mimeType: 'audio/webm' })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al transcribir');
        var texto = (data.texto || '').trim();
        if (!texto) {
          setEstado('CALMADO', null);
          return;
        }
        await enviar(texto);
      } catch (e) {
        addMsg('Error de transcripcion: ' + e.message, 'bot', 'Sistema');
        setEstado('CALMADO', null);
      }
    }

    addMsg('Hola. Soy Yarvis. Escribe, habla o envia una imagen.\nComandos: /atlas /code /nova /lumen /resumen /formal /casual', 'bot', 'Yarvis');
  </script>
</body>
  </html>
