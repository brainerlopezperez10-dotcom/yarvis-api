<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Yarvis Copilot V2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#f8fafc;height:100vh;display:flex;overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.sidebar{width:270px;background:#111827;border-right:1px solid #334155;padding:12px;display:flex;flex-direction:column;gap:10px}
.logo{font-size:22px;font-weight:800;color:#38bdf8;padding:8px}
.new{background:#0284c7;color:white;border:0;border-radius:9px;padding:11px;font-weight:700}
.search{width:100%;padding:9px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white}
.side-title{font-size:11px;color:#64748b;text-transform:uppercase;margin-top:8px}
#history{overflow:auto;display:flex;flex-direction:column;gap:5px}
.chatitem{background:transparent;color:#cbd5e1;border:0;text-align:left;padding:9px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem:hover{background:#1e293b}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{background:#1e293b;padding:10px 14px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{color:#38bdf8;font-size:18px}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select,.headbtn{background:#0f172a;color:#38bdf8;border:1px solid #38bdf8;border-radius:7px;padding:6px 9px}
.chat{flex:1;padding:15px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:12px;line-height:1.5;font-size:14px;word-break:break-word;position:relative}
.user{background:#0284c7;align-self:flex-end}
.yarvis{background:#334155;align-self:flex-start;border-left:3px solid #38bdf8;padding-right:38px}
.msg pre{background:#020617;padding:10px;border-radius:8px;overflow:auto;margin:8px 0}
.msg code{font-family:monospace}
.speak,.copy{position:absolute;top:7px;background:transparent;border:0;color:#38bdf8}
.speak{right:8px}
.copy{right:31px}
.typing{opacity:.7;font-style:italic}
.preview{display:none;padding:8px 15px;border-top:1px solid #334155;gap:8px;align-items:center}
.preview img{height:55px;border-radius:7px}
.input{padding:10px;background:#1e293b;border-top:1px solid #334155;display:flex;gap:7px;align-items:center}
.input input[type=text]{flex:1;padding:11px 13px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
.action{width:42px;height:42px;border-radius:9px;border:1px solid #38bdf8;background:transparent;color:#38bdf8;font-size:18px}
.action.recording{background:#ef4444;color:white;border-color:#ef4444}
.send{padding:11px 15px;border:0;border-radius:9px;background:#38bdf8;color:#082f49;font-weight:800}
.status{font-size:11px;color:#94a3b8}
.mobileMenu{display:none}

@media(max-width:750px){
  .sidebar{display:none}
  .sidebar.open{
    display:flex;
    position:fixed;
    z-index:20;
    left:0;
    top:0;
    bottom:0
  }
  .mobileMenu{display:block}
  .controls label{display:none}
  .msg{max-width:94%}
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

  <div class="logo">🤖 Yarvis</div>

  <button class="new" onclick="nuevaConversacion()">
    ＋ Nueva conversación
  </button>

  <input
    class="search"
    id="search"
    placeholder="Buscar chats..."
    oninput="filtrarChats()"
  >

  <div class="side-title">Conversaciones</div>

  <div id="history"></div>

  <div style="margin-top:auto;font-size:12px;color:#64748b">
    Yarvis V2 • Web AI
  </div>

</aside>

<main class="main">

<header>

  <div style="display:flex;align-items:center;gap:8px">

    <button
      class="headbtn mobileMenu"
      onclick="toggleSide()"
    >
      ☰
    </button>

    <h1>🤖 Yarvis</h1>

  </div>

  <div class="controls">

    <select id="mode">

      <option value="asistente">
        ⚡ Asistente
      </option>

      <option value="explicativo">
        📚 Explicativo
      </option>

      <option value="creativo">
        🎨 Creativo
      </option>

      <option value="programador">
        💻 Programador
      </option>

      <option value="investigador">
        🔬 Investigador
      </option>

      <option value="busqueda">
        🔎 Búsqueda web
      </option>

    </select>

    <select id="voice"></select>

    <button
      class="headbtn"
      id="auto"
      onclick="toggleAuto()"
    >
      🔊 OFF
    </button>

    <button
      class="headbtn"
      onclick="showMemory()"
    >
      🧠
    </button>

  </div>

</header>


<div class="chat" id="chat"></div>


<div class="preview" id="preview">

  <img id="previewImg">

  <span id="fileLabel"></span>

  <button
    class="action"
    onclick="clearAttachment()"
  >
    ✕
  </button>

</div>


<div class="input">

  <button
    class="action"
    title="Adjuntar imagen"
    onclick="document.getElementById('img').click()"
  >
    📷
  </button>

  <button
    class="action"
    title="Archivo"
    onclick="document.getElementById('file').click()"
  >
    📎
  </button>

  <button
    class="action"
    id="mic"
    title="Voz"
    onclick="toggleMic()"
  >
    🎙️
  </button>


  <input
    id="img"
    type="file"
    accept="image/*"
    hidden
    onchange="pickImage(event)"
  >


  <input
    id="file"
    type="file"
    accept=".txt,.md,.csv,.json,.js,.ts,.html,.css,.py,.java,.cpp,.c,.php,.pdf"
    hidden
    onchange="pickFile(event)"
  >


  <input
    id="message"
    type="text"
    placeholder="Escribe a Yarvis..."
    onkeydown="if(event.key==='Enter')send()"
  >


  <button
    class="send"
    onclick="send()"
  >
    Enviar
  </button>

</div>


<div
  class="status"
  id="status"
  style="padding:3px 12px 6px;background:#1e293b"
></div>


<audio id="audio" hidden></audio>

</main>


<script>

const $ = id => document.getElementById(id);


/* VARIABLES */

let image64 = null;
let imageMime = null;

let fileContext = '';
let fileName = '';

let autoTTS = false;

let recording = false;
let rec = null;
let chunks = [];


/* IDENTIFICADOR DEL USUARIO */

let userId =
  localStorage.getItem('yarvis_user_id') ||
  crypto.randomUUID();

localStorage.setItem(
  'yarvis_user_id',
  userId
);


/* SESIÓN */

let sessionId =
  localStorage.getItem('yarvis_session_id') ||
  crypto.randomUUID();

localStorage.setItem(
  'yarvis_session_id',
  sessionId
);


let conversations = [];


/* VOCES */

const voices = [

  'Aaliyah-PlayAI',
  'Arista-PlayAI',
  'Atlas-PlayAI',
  'Briggs-PlayAI',
  'Calum-PlayAI',
  'Celeste-PlayAI',
  'Cheyenne-PlayAI',
  'Deedee-PlayAI',
  'Fritz-PlayAI',
  'Gail-PlayAI',
  'Indigo-PlayAI',
  'Mason-PlayAI',
  'Mitch-PlayAI',
  'Quinn-PlayAI',
  'Thunder-PlayAI'

];


voices.forEach(v => {

  let o = document.createElement('option');

  o.value = v;

  o.textContent =
    v.replace('-PlayAI','');

  $('voice').appendChild(o);

});


/* SEGURIDAD HTML */

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


/* FORMATO DE RESPUESTA */

function formatText(s){

  let x = esc(s);

  x = x.replace(
    /```([\s\S]*?)```/g,
    '<pre><code>$1</code></pre>'
  );

  x = x.replace(
    /\*\*(.*?)\*\*/g,
    '<strong>$1</strong>'
  );

  x = x.replace(
    /\n/g,
    '<br>'
  );

  return x;

}


/* AGREGAR MENSAJE */

function addMsg(
  text,
  who = 'yarvis',
  speak = true
){

  const d =
    document.createElement('div');

  d.className =
    'msg ' + who;


  if(who === 'yarvis'){

    d.innerHTML = `

      <button
        class="copy"
        onclick="
          navigator.clipboard.writeText(
            this.parentElement.innerText
          )
        "
      >
        📋
      </button>

      <button
        class="speak"
        onclick="
          speak(
            this.parentElement.innerText
          )
        "
      >
        🔊
      </button>

      ${formatText(text)}

    `;

  }else{

    d.innerHTML =
      formatText(text);

  }


  $('chat').appendChild(d);

  $('chat').scrollTop =
    $('chat').scrollHeight;


  if(
    who === 'yarvis' &&
    autoTTS &&
    speak
  ){

    speak(text);

  }

}


/* MENSAJE INICIAL */

function boot(){

  addMsg(
`¡Hola! Soy Yarvis V2. 🚀

Puedo conversar, analizar imágenes, buscar información actual, ayudarte a programar, trabajar con archivos, recordar datos y responder por voz.

¿En qué te ayudo?`
  );

  loadChats();

}

boot();


/* TEXTO A VOZ */

async function speak(text){

  try{

    const r = await fetch(
      '/hablar',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/json'
        },
        body:JSON.stringify({
          texto:text.slice(0,3000),
          voice:$('voice').value
        })
      }
    );


    const d = await r.json();


    if(d.error)
      throw Error(d.error);


    const audio =
      $('audio');


    audio.src =
      `data:${d.mimeType};base64,${d.audio}`;


    audio.play();

  }

  catch(e){

    console.error(
      'Error TTS:',
      e
    );

  }

}


/* VOZ AUTOMÁTICA */

function toggleAuto(){

  autoTTS =
    !autoTTS;


  $('auto').textContent =
    autoTTS
      ? '🔊 ON'
      : '🔊 OFF';


  $('auto').classList.toggle(
    'active',
    autoTTS
  );

}


/* IMAGEN */

function pickImage(e){

  const f =
    e.target.files[0];


  if(!f)
    return;


  imageMime =
    f.type;


  const reader =
    new FileReader();


  reader.onload = () => {

    image64 =
      reader.result.split(',')[1];


    $('previewImg').src =
      reader.result;


    $('fileLabel').textContent =
      f.name;


    $('preview').style.display =
      'flex';

  };


  reader.readAsDataURL(f);

}


/* ARCHIVO */

async function pickFile(e){

  const f =
    e.target.files[0];


  if(!f)
    return;


  if(
    f.size >
    10 * 1024 * 1024
  ){

    alert(
      'Máximo 10 MB.'
    );

    return;

  }


  $('status').textContent =
    'Leyendo archivo...';


  const b =
    await blob64(f);


  const r =
    await fetch(
      '/file',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/json'
        },
        body:JSON.stringify({
          file:b,
          name:f.name,
          mimeType:f.type
        })
      }
    );


  const d =
    await r.json();


  if(d.error){

    alert(d.error);

    return;

  }


  fileContext =
    d.text;


  fileName =
    f.name;


  $('fileLabel').textContent =
    '📎 ' + f.name;


  $('preview').style.display =
    'flex';


  $('status').textContent =
    'Archivo listo para Yarvis.';

}


/* BASE64 */

function blob64(blob){

  return new Promise(
    (ok,no) => {

      const r =
        new FileReader();


      r.onload =
        () =>
          ok(
            r.result.split(',')[1]
          );


      r.onerror =
        no;


      r.readAsDataURL(blob);

    }
  );

}


/* LIMPIAR ARCHIVO */

function clearAttachment(){

  image64 = null;

  imageMime = null;

  fileContext = '';

  fileName = '';


  $('img').value = '';

  $('file').value = '';


  $('preview').style.display =
    'none';

}


/* ENVIAR */

async function send(){

  const input =
    $('message');


  const text =
    input.value.trim();


  if(
    !text &&
    !image64 &&
    !fileContext
  )
    return;


  let displayText = '';


  if(image64)
    displayText +=
      '📷 Imagen\n';


  if(fileName)
    displayText +=
      '📎 ' + fileName + '\n';


  displayText += text;


  addMsg(
    displayText,
    'user',
    false
  );


  input.value = '';


  $('status').textContent =
    'Yarvis está pensando...';


  const typing =
    document.createElement('div');


  typing.className =
    'msg yarvis typing';


  typing.textContent =
    'Yarvis está pensando...';


  $('chat').appendChild(
    typing
  );


  $('chat').scrollTop =
    $('chat').scrollHeight;


  try{

    const r =
      await fetch(
        '/chat',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:JSON.stringify({

            mensaje:text,

            sessionId:

              sessionId,

            userId:

              userId,

            modo:

              $('mode').value,

            imagen:

              image64,

            mimeType:

              imageMime,

            fileContext:

              fileContext

          })

        }
      );


    const d =
      await r.json();


    typing.remove();


    if(d.error)
      throw Error(d.error);


    addMsg(
      d.respuesta
    );


    $('status').textContent =
      'Listo.';


    loadChats();

  }

  catch(e){

    typing.remove();


    addMsg(
      '⚠️ ' + e.message
    );


    $('status').textContent =
      'Error';

  }


  clearAttachment();

}


/* MICROFONO */

async function toggleMic(){

  if(recording){

    rec.stop();


    rec.stream
      .getTracks()
      .forEach(
        t => t.stop()
      );


    recording = false;


    $('mic')
      .classList
      .remove('recording');


    return;

  }


  try{

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    rec =
      new MediaRecorder(
        stream
      );


    chunks = [];


    rec.ondataavailable =
      e =>
        chunks.push(e.data);


    rec.onstop =
      transcribe;


    rec.start();


    recording = true;


    $('mic')
      .classList
      .add('recording');

  }

  catch(e){

    alert(
      'No se pudo usar el micrófono: ' +
      e.message
    );

  }

}


/* TRANSCRIBIR */

async function transcribe(){

  $('status').textContent =
    'Transcribiendo...';


  const blob =
    new Blob(
      chunks,
      {
        type:'audio/webm'
      }
    );


  const b =
    await blob64(blob);


  const r =
    await fetch(
      '/transcribir',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/json'
        },
        body:JSON.stringify({
          audio:b,
          mimeType:'audio/webm'
        })
      }
    );


  const d =
    await r.json();


  if(d.error){

    alert(d.error);

  }

  else{

    $('message').value =
      d.texto || '';

  }


  $('status').textContent =
    '';

}


/* NUEVA CONVERSACIÓN */

function nuevaConversacion(){

  sessionId =
    crypto.randomUUID();


  localStorage.setItem(
    'yarvis_session_id',
    sessionId
  );


  $('chat').innerHTML =
    '';


  addMsg(
    'Nueva conversación iniciada. ¿En qué te ayudo?'
  );


  toggleSide(false);

}


/* CARGAR HISTORIAL */

async function loadChats(){

  try{

    const r =
      await fetch(
        '/conversations?userId=' +
        encodeURIComponent(userId)
      );


    const d =
      await r.json();


    conversations =
      d.conversations || [];


    renderChats();

  }

  catch(e){

    console.error(
      'Historial:',
      e
    );

  }

}


/* MOSTRAR HISTORIAL */

function renderChats(){

  const q =
    $('search')
      .value
      .toLowerCase();


  $('history').innerHTML =
    '';


  conversations

    .filter(
      c =>
        c.title
          .toLowerCase()
          .includes(q)
    )

    .slice(-50)

    .reverse()

    .forEach(c => {

      const b =
        document.createElement(
          'button'
        );


      b.className =
        'chatitem';


      b.textContent =
        '💬 ' + c.title;


      b.onclick =
        () => {

          sessionId =
            c.id;


          localStorage.setItem(
            'yarvis_session_id',
            sessionId
          );


          toggleSide(false);

        };


      $('history')
        .appendChild(b);

    });

}


/* BUSCAR CHATS */

function filtrarChats(){

  renderChats();

}


/* MEMORIA */

async function showMemory(){

  try{

    const r =
      await fetch(
        '/memory?userId=' +
        encodeURIComponent(userId)
      );


    const d =
      await r.json();


    const list =
      d.memories || [];


    const texto =
      list.length

      ?

      list
        .map(
          m =>
            '• ' + m.text
        )
        .join('\n')

      :

      'No hay recuerdos.';


    const add =
      prompt(
`🧠 MEMORIA DE YARVIS

${texto}

Escribe algo para guardar:
`
      );


    if(
      add &&
      add.trim()
    ){

      await fetch(
        '/memory/add',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:JSON.stringify({

            userId:

              userId,

            text:

              add

          })

        }
      );


      alert(
        '🧠 Memoria guardada.'
      );

    }

  }

  catch(e){

    alert(
      'No se pudo cargar la memoria.'
    );

  }

}


/* MENÚ MÓVIL */

function toggleSide(force){

  if(
    window.innerWidth > 750
  )
    return;


  const s =
    $('sidebar');


  if(force === false){

    s.classList.remove(
      'open'
    );

  }

  else{

    s.classList.toggle(
      'open'
    );

  }

}

</script>

</body>
  </html>
