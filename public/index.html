<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Yarvis</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  height:100%;
  height:100dvh;
}

body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#000;
  color:#e0f7ff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ESTRELLAS */

.stars{
  position:fixed;
  inset:0;

  background:
    radial-gradient(1px 1px at 20% 30%,#fff,transparent),
    radial-gradient(1px 1px at 60% 70%,#fff,transparent),
    radial-gradient(1px 1px at 80% 20%,#aef,transparent),
    radial-gradient(1px 1px at 40% 80%,#fff,transparent);

  background-size:200px 200px;

  opacity:.3;

  pointer-events:none;

  z-index:0;
}

/* CABECERA */

header{
  position:relative;
  z-index:2;

  padding:10px 14px;

  text-align:center;

  border-bottom:
    1px solid rgba(0,200,255,.15);

  background:
    rgba(0,10,20,.8);

  flex-shrink:0;
}

header h1{
  font-size:1.05rem;

  letter-spacing:.15em;

  color:#7df9ff;
}

header span{
  display:block;

  font-size:.68rem;

  color:#5a9aaa;

  margin-top:2px;
}

/* NÚCLEO */

.core-wrap{
  height:100px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  position:relative;

  z-index:1;
}

.core{
  width:70px;
  height:70px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 35%,
      #e0ffff,
      #00d4ff 40%,
      #0066aa 70%,
      #001428
    );

  box-shadow:
    0 0 16px #00e5ff,
    0 0 32px #00aaff,
    0 0 50px rgba(0,180,255,.4);

  animation:pulse 2.5s ease-in-out infinite;

  position:relative;
}

.core:before{
  content:'';

  position:absolute;

  inset:-12px;

  border-radius:50%;

  border:
    1px solid rgba(0,220,255,.35);

  animation:ring 3s linear infinite;
}

.core.listening{
  box-shadow:
    0 0 24px #00ffcc,
    0 0 48px #00ffaa;

  animation:
    pulse-fast .8s ease-in-out infinite;
}

.core.thinking{
  box-shadow:
    0 0 24px #ffaa00,
    0 0 48px #ff8800;
}

.core.speaking{
  box-shadow:
    0 0 24px #7c5cff,
    0 0 48px #5a3fff;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.06);
  }

}

@keyframes pulse-fast{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.12);
  }

}

@keyframes ring{

  from{
    transform:rotate(0);
  }

  to{
    transform:rotate(360deg);
  }

}

/* ESTADO */

.status{
  text-align:center;

  font-size:.72rem;

  color:#5a9aaa;

  padding:2px 8px 6px;

  flex-shrink:0;

  position:relative;

  z-index:2;
}

/* CHAT */

#chat{
  flex:1 1 auto;

  min-height:0;

  overflow-y:auto;

  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior:contain;

  padding:8px 12px 130px;

  display:flex;

  flex-direction:column;

  gap:10px;

  position:relative;

  z-index:2;
}

.msg{
  max-width:92%;

  padding:10px 12px;

  border-radius:14px;

  font-size:.9rem;

  line-height:1.45;

  white-space:pre-wrap;

  word-break:break-word;

  flex-shrink:0;
}

.msg.user{
  align-self:flex-end;

  background:
    rgba(0,100,160,.4);

  border:
    1px solid rgba(0,200,255,.25);
}

.msg.bot{
  align-self:flex-start;

  background:
    rgba(0,40,60,.75);

  border:
    1px solid rgba(0,180,255,.2);
}

.msg .agent{
  display:block;

  font-size:.68rem;

  color:#7df9ff;

  margin-bottom:4px;

  letter-spacing:.04em;
}

/* FUENTES */

.fuentes{
  margin-top:8px;

  padding-top:8px;

  border-top:
    1px solid rgba(0,180,255,.2);

  font-size:.75rem;
}

.fuentes a{
  display:block;

  color:#7df9ff;

  text-decoration:none;

  margin-bottom:4px;

  word-break:break-all;
}

.fuentes a:hover{
  text-decoration:underline;
}

/* BOTONES INFERIORES */

.bar{
  position:fixed;

  bottom:0;

  left:0;

  right:0;

  z-index:10;

  padding:
    8px
    10px
    calc(12px + env(safe-area-inset-bottom,0px));

  background:
    linear-gradient(
      transparent,
      rgba(0,8,16,.98) 20%
    );

  display:flex;

  gap:6px;

  align-items:center;
}

#input{
  flex:1;

  background:
    rgba(0,30,50,.9);

  border:
    1px solid rgba(0,200,255,.3);

  border-radius:22px;

  padding:11px 14px;

  color:#e0f7ff;

  font-size:.92rem;

  outline:none;
}

#input::placeholder{
  color:#4a7a8a;
}

button.icon{
  width:44px;

  height:44px;

  border-radius:50%;

  border:none;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:1.1rem;

  flex-shrink:0;
}

button.icon:active{
  transform:scale(.92);
}

#btnSend{
  background:
    linear-gradient(
      145deg,
      #00b4e6,
      #0077aa
    );

  color:#fff;
}

#btnMic{
  background:
    linear-gradient(
      145deg,
      #00c9a0,
      #008866
    );

  color:#fff;
}

#btnMic.recording{
  background:
    linear-gradient(
      145deg,
      #ff4466,
      #cc2244
    );

  animation:
    pulse-fast .7s ease-in-out infinite;
}

#btnImg{
  background:
    linear-gradient(
      145deg,
      #7c5cff,
      #5a3fff
    );

  color:#fff;
}

#fileImg{
  display:none;
}

/* SUGERENCIAS */

.hints{
  position:relative;

  z-index:2;

  flex-shrink:0;

  padding:0 10px 6px;

  display:flex;

  gap:6px;

  overflow-x:auto;

  -webkit-overflow-scrolling:touch;
}

.hint{
  flex-shrink:0;

  font-size:.68rem;

  padding:4px 8px;

  border-radius:12px;

  border:
    1px solid rgba(0,180,255,.25);

  background:
    rgba(0,40,60,.5);

  color:#8ec8d8;

  cursor:pointer;

  white-space:nowrap;
}


/* =====================================================
   COPILOTO FLOTANTE
   ===================================================== */

#copiloto{

  position:fixed;

  right:16px;

  bottom:82px;

  z-index:1000;

}


/* BOTÓN DEL COPILOTO */

#copilotoBtn{

  width:58px;

  height:58px;

  border-radius:50%;

  border:
    1px solid rgba(0,220,255,.55);

  background:
    radial-gradient(
      circle at 35% 30%,
      #e0ffff,
      #00d4ff 35%,
      #0066aa 75%,
      #001428
    );

  box-shadow:
    0 0 15px #00e5ff,
    0 0 35px rgba(0,180,255,.65);

  color:#fff;

  font-size:1.5rem;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  animation:
    copilotoPulse 2.5s ease-in-out infinite;
}

#copilotoBtn:active{
  transform:scale(.9);
}

@keyframes copilotoPulse{

  0%,100%{
    box-shadow:
      0 0 15px #00e5ff,
      0 0 35px rgba(0,180,255,.65);
  }

  50%{
    box-shadow:
      0 0 25px #00e5ff,
      0 0 55px rgba(0,180,255,.8);
  }

}


/* PANEL */

#copilotoPanel{

  position:absolute;

  right:0;

  bottom:70px;

  width:
    min(
      320px,
      calc(100vw - 30px)
    );

  background:
    rgba(0,15,28,.96);

  border:
    1px solid rgba(0,210,255,.35);

  border-radius:18px;

  box-shadow:
    0 0 25px rgba(0,180,255,.3),
    0 15px 45px rgba(0,0,0,.7);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  overflow:hidden;

  display:none;
}

#copilotoPanel.abierto{

  display:block;

  animation:
    copilotoEntrada .2s ease-out;
}

@keyframes copilotoEntrada{

  from{
    opacity:0;
    transform:
      translateY(10px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


/* CABECERA DEL COPILOTO */

.copilotoHeader{

  padding:12px 14px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  border-bottom:
    1px solid rgba(0,200,255,.15);
}

.copilotoTitulo{

  color:#7df9ff;

  font-size:.85rem;

  font-weight:700;

  letter-spacing:.08em;
}

.copilotoCerrar{

  background:transparent;

  border:none;

  color:#6f9eaa;

  font-size:1.1rem;

  cursor:pointer;
}


/* CONTENIDO */

.copilotoContenido{

  padding:14px;
}

.copilotoTexto{

  color:#b9e9f4;

  font-size:.82rem;

  line-height:1.4;

  margin-bottom:12px;
}


/* ACCIONES */

.copilotoAcciones{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;
}

.copilotoAccion{

  border:
    1px solid rgba(0,190,255,.25);

  background:
    rgba(0,60,85,.5);

  color:#9de8f5;

  border-radius:12px;

  padding:10px 8px;

  font-size:.75rem;

  cursor:pointer;
}

.copilotoAccion:active{

  transform:scale(.96);

  background:
    rgba(0,100,140,.6);
}


@media(max-width:420px){

  #copiloto{

    right:12px;

    bottom:82px;

  }

  #copilotoBtn{

    width:54px;

    height:54px;

  }

}

</style>

  <!-- ============================================================
       JAVASCRIPT DEL COPILOTO
       ============================================================ -->

  <script>

    (function() {

      var copilotoBtn =
        document.getElementById(
          'copilotoBtn'
        );

      var copilotoPanel =
        document.getElementById(
          'copilotoPanel'
        );

      var copilotoCerrar =
        document.getElementById(
          'copilotoCerrar'
        );

      var copilotoContenido =
        document.getElementById(
          'copilotoContenido'
        );

      if (
        !copilotoBtn ||
        !copilotoPanel
      ) {
        return;
      }

      function abrirCopiloto() {

        copilotoPanel.classList.add(
          'abierto'
        );

      }

      function cerrarCopiloto() {

        copilotoPanel.classList.remove(
          'abierto'
        );

      }

      copilotoBtn.addEventListener(
        'click',
        function() {

          if (
            copilotoPanel.classList.contains(
              'abierto'
            )
          ) {

            cerrarCopiloto();

          } else {

            abrirCopiloto();

          }

        }
      );

      copilotoCerrar.addEventListener(
        'click',
        cerrarCopiloto
      );

      document
        .querySelectorAll(
          '.copilotoAccion'
        )
        .forEach(
          function(boton) {

            boton.addEventListener(
              'click',
              function() {

                var accion =
                  boton.getAttribute(
                    'data-copiloto'
                  );

                if (
                  accion ===
                  'resumen'
                ) {

                  input.value =
                    '/resumen';

                }

                if (
                  accion ===
                  'explicar'
                ) {

                  input.value =
                    '/lumen ';

                }

                if (
                  accion ===
                  'codigo'
                ) {

                  input.value =
                    '/code ';

                }

                if (
                  accion ===
                  'buscar'
                ) {

                  input.value =
                    '/atlas ';

                }

                cerrarCopiloto();

                input.focus();

              }
            );

          }
        );

    })();

  </script>

            type="button"
            data-copiloto-action="notas">
            <span>📝</span>
            <b>Mis notas</b>
          </button>

          <button
            type="button"
            data-copiloto-action="ayuda">
            <span>?</span>
            <b>Ayuda</b>
          </button>

        </div>

        <div
          id="copilotoContenido"
          data-inicio="true">
        </div>

      </div>
    `;

    document.body.appendChild(copiloto);
  }

  /* =========================================================
     ESTILOS DEL COPILOTO
     ========================================================= */

  if (!document.getElementById('estilosCopiloto')) {

    var estilo = document.createElement('style');
    estilo.id = 'estilosCopiloto';

    estilo.textContent = `
      #copilotoFlotante {
        position: fixed;
        right: 16px;
        bottom: 82px;
        z-index: 9999;
        font-family: system-ui, sans-serif;
      }

      #btnCopiloto {
        width: 54px;
        height: 54px;
        border: 1px solid rgba(0,220,255,.45);
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 30%,
          #dfffff 0%,
          #00d4ff 30%,
          #0066aa 70%,
          #001428 100%);
        color: white;
        font-size: 25px;
        box-shadow:
          0 0 12px #00dfff,
          0 0 28px rgba(0,180,255,.65);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: copilotoPulso 2s ease-in-out infinite;
      }

      @keyframes copilotoPulso {
        0%,100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.07);
        }
      }

      #btnCopiloto:active {
        transform: scale(.9);
      }

      #copilotoPanel {
        position: absolute;
        right: 0;
        bottom: 66px;
        width: min(310px, calc(100vw - 30px));
        padding: 12px;
        border-radius: 20px;
        border: 1px solid rgba(0,210,255,.28);
        background:
          linear-gradient(
            145deg,
            rgba(0,25,40,.98),
            rgba(0,7,15,.98)
          );
        box-shadow:
          0 0 25px rgba(0,190,255,.25),
          0 15px 45px rgba(0,0,0,.65);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px) scale(.96);
        transition:
          opacity .2s ease,
          transform .2s ease,
          visibility .2s ease;
      }

      #copilotoPanel.abierto {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .copilotoTitulo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        color: #7df9ff;
      }

      .copilotoTitulo strong {
        display: block;
        letter-spacing: .12em;
        font-size: .9rem;
      }

      .copilotoTitulo span {
        display: block;
        color: #579aaa;
        font-size: .65rem;
        margin-top: 2px;
      }

      #cerrarCopiloto {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,.07);
        color: #9bcbd5;
        font-size: 20px;
        cursor: pointer;
      }

      .copilotoAcciones {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .copilotoAcciones button {
        min-height: 70px;
        border-radius: 14px;
        border: 1px solid rgba(0,190,255,.2);
        background: rgba(0,55,75,.45);
        color: #dffaff;
        padding: 8px;
        cursor: pointer;
        text-align: left;
      }

      .copilotoAcciones button:active {
        transform: scale(.96);
        background: rgba(0,100,135,.6);
      }

      .copilotoAcciones button span {
        display: block;
        font-size: 20px;
        margin-bottom: 4px;
      }

      .copilotoAcciones button b {
        display: block;
        font-size: .68rem;
        font-weight: 500;
      }

      #copilotoContenido {
        margin-top: 10px;
        max-height: 190px;
        overflow-y: auto;
        font-size: .75rem;
        line-height: 1.45;
        color: #a8d8e3;
      }

      .copilotoItem {
        padding: 8px;
        margin-bottom: 6px;
        border-radius: 10px;
        background: rgba(0,70,90,.3);
        border: 1px solid rgba(0,180,255,.12);
      }

      .copilotoItem strong {
        color: #7df9ff;
      }

      .copilotoVacio {
        padding: 10px;
        text-align: center;
        color: #63909d;
      }

      @media (max-width: 380px) {

        #copilotoFlotante {
          right: 10px;
        }

        #copilotoPanel {
          width: calc(100vw - 20px);
        }

      }
    `;

    document.head.appendChild(estilo);
  }

  /* =========================================================
     ABRIR / CERRAR
     ========================================================= */

  var btnCopiloto =
    document.getElementById('btnCopiloto');

  var panelCopiloto =
    document.getElementById('copilotoPanel');

  var cerrarCopiloto =
    document.getElementById('cerrarCopiloto');

  if (btnCopiloto && panelCopiloto) {

    btnCopiloto.addEventListener(
      'click',
      function () {

        panelCopiloto.classList.toggle('abierto');

      }
    );

  }

  if (cerrarCopiloto && panelCopiloto) {

    cerrarCopiloto.addEventListener(
      'click',
      function () {

        panelCopiloto.classList.remove('abierto');

      }
    );

  }

  /* =========================================================
     CONTENIDO
     ========================================================= */

  var contenido =
    document.getElementById('copilotoContenido');

  function mostrarContenido(html) {

    if (!contenido) return;

    contenido.dataset.inicio = 'false';
    contenido.innerHTML = html;

  }

  /* =========================================================
     ACCIÓN — NUEVA CONVERSACIÓN
     ========================================================= */

  function nuevaConversacion() {

    var confirmar =
      window.confirm(
        '¿Quieres comenzar una nueva conversación?'
      );

    if (!confirmar) return;

    if (typeof chat !== 'undefined' && chat) {
      chat.innerHTML = '';
    }

    var nuevoSid =
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2);

    localStorage.setItem(
      'yarvis_sid',
      nuevoSid
    );

    window.sessionId =
      'web_' + nuevoSid;

    if (input) {
      input.value = '';
      input.focus();
    }

    mensajeSistema(
      'Nueva conversación iniciada.'
    );

    mostrarContenido(
      '<div class="copilotoVacio">Nueva conversación lista.</div>'
    );

  }

  /* =========================================================
     ACCIÓN — MEMORIA
     ========================================================= */

  async function cargarMemoria() {

    mostrarContenido(
      '<div class="copilotoVacio">🧠 Cargando memoria...</div>'
    );

    try {

      var res =
        await fetch(
          '/memory?userId=' +
          encodeURIComponent(obtenerUserId())
        );

      var data =
        await res.json();

      if (!res.ok) {
        throw new Error(
          data.error || 'Error'
        );
      }

      var lista =
        data.memories || [];

      if (!lista.length) {

        mostrarContenido(
          '<div class="copilotoVacio">' +
          'Yarvis todavía no tiene recuerdos guardados.' +
          '</div>'
        );

        return;
      }

      var html = '';

      lista.slice(-10).forEach(
        function (item) {

          html +=
            '<div class="copilotoItem">' +
            '<strong>🧠</strong> ' +
            escapeHTML(item.text || '') +
            '</div>';

        }
      );

      mostrarContenido(html);

    } catch (e) {

      mostrarContenido(
        '<div class="copilotoVacio">' +
        'No se pudo cargar la memoria.' +
        '</div>'
      );

    }

  }

  /* =========================================================
     ACCIÓN — NOTAS
     ========================================================= */

  async function cargarNotas() {

    mostrarContenido(
      '<div class="copilotoVacio">📝 Cargando notas...</div>'
    );

    try {

      var res =
        await fetch(
          '/notes?userId=' +
          encodeURIComponent(obtenerUserId())
        );

      var data =
        await res.json();

      if (!res.ok) {
        throw new Error(
          data.error || 'Error'
        );
      }

      var lista =
        data.notes || [];

      if (!lista.length) {

        mostrarContenido(
          '<div class="copilotoVacio">' +
          'No tienes notas guardadas.' +
          '</div>'
        );

        return;
      }

      var html = '';

      lista.slice(-10).reverse().forEach(
        function (item) {

          html +=
            '<div class="copilotoItem">' +
            '<strong>📝</strong> ' +
            escapeHTML(item.text || '') +
            '</div>';

        }
      );

      mostrarContenido(html);

    } catch (e) {

      mostrarContenido(
        '<div class="copilotoVacio">' +
        'No se pudieron cargar las notas.' +
        '</div>'
      );

    }

  }

  /* =========================================================
     ACCIÓN — AYUDA
     ========================================================= */

  function mostrarAyuda() {

    mostrarContenido(
      '<div class="copilotoItem">' +
      '<strong>Comandos</strong><br><br>' +
      '/atlas — investigar en Internet<br>' +
      '/code — programar<br>' +
      '/nova — creatividad<br>' +
      '/lumen — explicar<br>' +
      '/resumen — resumir conversación<br>' +
      '/formal — tono formal<br>' +
      '/casual — tono casual' +
      '</div>'
    );

  }

  /* =========================================================
     SEGURIDAD HTML
     ========================================================= */

  function escapeHTML(texto) {

    return String(texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }

  /* =========================================================
     BOTONES DEL COPILOTO
     ========================================================= */

  document
    .querySelectorAll(
      '[data-copiloto-action]'
    )
    .forEach(function (boton) {

      boton.addEventListener(
        'click',
        function () {

          var accion =
            boton.getAttribute(
              'data-copiloto-action'
            );

          if (accion === 'nuevo') {
            nuevaConversacion();
          }

          else if (accion === 'memoria') {
            cargarMemoria();
          }

          else if (accion === 'notas') {
            cargarNotas();
          }

          else if (accion === 'ayuda') {
            mostrarAyuda();
          }

        }
      );

    });

  /* =========================================================
     CERRAR AL TOCAR FUERA
     ========================================================= */

  document.addEventListener(
    'click',
    function (e) {

      if (
        !copiloto ||
        !panelCopiloto ||
        !panelCopiloto.classList.contains('abierto')
      ) {
        return;
      }

      if (
        !copiloto.contains(e.target)
      ) {

        panelCopiloto.classList.remove(
          'abierto'
        );

      }

    }
  );

  /* =========================================================
     INICIO
     ========================================================= */

  mostrarEstado('Listo');

  console.log(
    '✓ Copiloto flotante de Yarvis cargado correctamente.'
  );

})();
  </script>
