<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Yarvis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #e0f7ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Fondo estrellado simple */
    .stars {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1px 1px at 20% 30%, #fff, transparent),
        radial-gradient(1px 1px at 60% 70%, #fff, transparent),
        radial-gradient(1px 1px at 80% 20%, #aef, transparent),
        radial-gradient(1px 1px at 40% 80%, #fff, transparent),
        radial-gradient(1px 1px at 10% 60%, #aef, transparent);
      background-size: 200px 200px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 2;
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 200, 255, 0.15);
      background: rgba(0, 10, 20, 0.7);
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: #7df9ff;
    }

    header span {
      display: block;
      font-size: 0.7rem;
      color: #5a9aaa;
      margin-top: 2px;
    }

    /* Núcleo azul */
    .core-wrap {
      position: relative;
      z-index: 1;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .core {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e0ffff, #00d4ff 40%, #0066aa 70%, #001428);
      box-shadow:
        0 0 20px #00e5ff,
        0 0 40px #00aaff,
        0 0 70px rgba(0, 180, 255, 0.5),
        inset 0 0 20px rgba(255, 255, 255, 0.3);
      animation: pulse 2.5s ease-in-out infinite;
      position: relative;
    }

    .core::before {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1px solid rgba(0, 220, 255, 0.35);
      animation: ring 3s linear infinite;
    }

    .core::after {
      content: '';
      position: absolute;
      inset: -32px;
      border-radius: 50%;
      border: 1px solid rgba(0, 180, 255, 0.15);
      animation: ring 4s linear infinite reverse;
    }

    .core.listening {
      box-shadow:
        0 0 30px #00ffcc,
        0 0 60px #00ffaa,
        0 0 90px rgba(0, 255, 200, 0.5);
      animation: pulse-fast 0.8s ease-in-out infinite;
    }

    .core.thinking {
      box-shadow:
        0 0 30px #ffaa00,
        0 0 60px #ff8800;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.9; }
    }

    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Chat */
    #chat {
      position: relative;
      z-index: 2;
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 100px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: rgba(0, 100, 160, 0.4);
      border: 1px solid rgba(0, 200, 255, 0.25);
    }

    .msg.bot {
      align-self: flex-start;
      background: rgba(0, 40, 60, 0.7);
      border: 1px solid rgba(0, 180, 255, 0.2);
    }

    .msg .agent {
      display: block;
      font-size: 0.7rem;
      color: #7df9ff;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }

    /* Barra inferior */
    .bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 10px 12px 16px;
      background: linear-gradient(transparent, rgba(0, 8, 16, 0.95) 30%);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #input {
      flex: 1;
      background: rgba(0, 30, 50, 0.85);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-radius: 24px;
      padding: 12px 16px;
      color: #e0f7ff;
      font-size: 0.95rem;
      outline: none;
    }

    #input::placeholder { color: #4a7a8a; }

    button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:active { transform: scale(0.92); }

    #btnSend {
      background: linear-gradient(145deg, #00b4e6, #0077aa);
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 180, 255, 0.4);
    }

    #btnMic {
      background: linear-gradient(145deg, #00c9a0, #008866);
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 200, 150, 0.4);
    }

    #btnMic.recording {
      background: linear-gradient(145deg, #ff4466, #cc2244);
      box-shadow: 0 0 16px rgba(255, 60, 80, 0.6);
      animation: pulse-fast 0.7s ease-in-out infinite;
    }

    .status {
      position: relative;
      z-index: 2;
      text-align: center;
      font-size: 0.75rem;
      color: #5a9aaa;
      padding: 4px;
      min-height: 22px;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <header>
    <h1>YARVIS</h1>
    <span>Asistente personal</span>
  </header>

  <div class="core-wrap">
    <div class="core" id="core"></div>
  </div>

  <div class="status" id="status">Listo</div>

  <div id="chat"></div>

  <div class="bar">
    <button id="btnMic" title="Hablar">🎤</button>
    <input id="input" type="text" placeholder="Escribe o habla..." autocomplete="off" />
    <button id="btnSend" title="Enviar">➤</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btnSend = document.getElementById('btnSend');
    const btnMic = document.getElementById('btnMic');
    const core = document.getElementById('core');
    const statusEl = document.getElementById('status');

    const sessionId = 'web_' + (localStorage.getItem('yarvis_sid') || (Date.now() + '_' + Math.random().toString(36).slice(2)));
    localStorage.setItem('yarvis_sid', sessionId.replace('web_', ''));

    function setStatus(t) {
      statusEl.textContent = t || '';
    }

    function addMsg(text, who, agentName) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      if (agentName && who === 'bot') {
        const ag = document.createElement('span');
        ag.className = 'agent';
        ag.textContent = agentName;
        div.appendChild(ag);
      }
      div.appendChild(document.createTextNode(text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function parseAgent(respuesta) {
      // Formato: "Atlas:\n\ntexto" o solo texto
      const m = respuesta.match(/^([A-Za-zÁÉÍÓÚáéíóúñÑ]+):\s*\n\n?([\s\S]*)$/);
      if (m) return { agent: m[1], text: m[2].trim() };
      return { agent: 'Yarvis', text: respuesta };
    }

    async function enviar(texto) {
      if (!texto || !texto.trim()) return;
      texto = texto.trim();
      input.value = '';
      addMsg(texto, 'user');
      setStatus('Pensando...');
      core.classList.add('thinking');
      core.classList.remove('listening');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mensaje: texto,
            sessionId: sessionId,
            userId: 'default'
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');

        const parsed = parseAgent(data.respuesta || '');
        addMsg(parsed.text, 'bot', parsed.agent);
        setStatus('Listo');

        // Reproducir voz
        hablar(parsed.text);
      } catch (e) {
        addMsg('Error: ' + e.message, 'bot', 'Sistema');
        setStatus('Error');
      }

      core.classList.remove('thinking');
    }

    async function hablar(texto) {
      if (!texto) return;
      try {
        setStatus('Hablando...');
        const res = await fetch('/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto: texto.slice(0, 800) })
        });
        if (!res.ok) return;
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.onended = function() {
          URL.revokeObjectURL(url);
          setStatus('Listo');
        };
        await audio.play();
      } catch (e) {
        setStatus('Listo');
      }
    }

    btnSend.addEventListener('click', function() {
      enviar(input.value);
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') enviar(input.value);
    });

    // -------- Micrófono --------
    let mediaRecorder = null;
    let chunks = [];
    let recording = false;

    btnMic.addEventListener('click', async function() {
      if (recording) {
        stopRec();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function(e) {
          if (e.data.size > 0) chunks.push(e.data);
        };
        mediaRecorder.onstop = async function() {
          stream.getTracks().forEach(function(t) { t.stop(); });
          const blob = new Blob(chunks, { type: 'audio/webm' });
          await transcribir(blob);
        };
        mediaRecorder.start();
        recording = true;
        btnMic.classList.add('recording');
        core.classList.add('listening');
        setStatus('Escuchando... (pulsa de nuevo para enviar)');
      } catch (e) {
        setStatus('No se pudo usar el micrófono');
        alert('Permite el micrófono en el navegador.');
      }
    });

    function stopRec() {
      if (mediaRecorder && recording) {
        mediaRecorder.stop();
        recording = false;
        btnMic.classList.remove('recording');
        core.classList.remove('listening');
        setStatus('Transcribiendo...');
      }
    }

    async function transcribir(blob) {
      try {
        const reader = new FileReader();
        const base64 = await new Promise(function(resolve, reject) {
          reader.onload = function() {
            const s = reader.result;
            resolve(s.split(',')[1] || s);
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });

        const res = await fetch('/transcribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            audio: base64,
            mimeType: 'audio/webm'
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al transcribir');

        const texto = (data.texto || '').trim();
        if (!texto) {
          setStatus('No se entendió el audio');
          return;
        }
        await enviar(texto);
      } catch (e) {
        setStatus('Error de voz');
        addMsg('Error de transcripción: ' + e.message, 'bot', 'Sistema');
      }
    }

    // Mensaje inicial
    addMsg('Hola. Soy Yarvis. Escribe o pulsa el micrófono para hablar.', 'bot', 'Yarvis');
  </script>
</body>
  </html>
