<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yarvis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{font-family:system-ui,-apple-system,sans-serif;background:#000;color:#e0f7ff;display:flex;flex-direction:column;overflow:hidden}
.stars{position:fixed;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 70%,#fff,transparent),radial-gradient(1px 1px at 80% 20%,#aef,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent);background-size:200px 200px;opacity:.3;pointer-events:none;z-index:0}
header{position:relative;z-index:2;padding:10px 14px;text-align:center;border-bottom:1px solid rgba(0,200,255,.15);background:rgba(0,10,20,.8);flex-shrink:0}
header h1{font-size:1.05rem;letter-spacing:.15em;color:#7df9ff}
header span{display:block;font-size:.68rem;color:#5a9aaa;margin-top:2px}
.core-wrap{height:100px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.core{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e0ffff,#00d4ff 40%,#0066aa 70%,#001428);box-shadow:0 0 16px #00e5ff,0 0 32px #00aaff,0 0 50px rgba(0,180,255,.4);animation:pulse 2.5s ease-in-out infinite;position:relative}
.core:before{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(0,220,255,.35);animation:ring 3s linear infinite}
.core.listening{box-shadow:0 0 24px #00ffcc,0 0 48px #00ffaa;animation:pulse-fast .8s ease-in-out infinite}
.core.thinking{box-shadow:0 0 24px #ffaa00,0 0 48px #ff8800}
.core.speaking{box-shadow:0 0 24px #7c5cff,0 0 48px #5a3fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pulse-fast{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes ring{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.status{text-align:center;font-size:.72rem;color:#5a9aaa;padding:2px 8px 6px;flex-shrink:0;position:relative;z-index:2}
#chat{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 12px 130px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;font-size:.9rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;flex-shrink:0}
.msg.user{align-self:flex-end;background:rgba(0,100,160,.4);border:1px solid rgba(0,200,255,.25)}
.msg.bot{align-self:flex-start;background:rgba(0,40,60,.75);border:1px solid rgba(0,180,255,.2)}
.msg .agent{display:block;font-size:.68rem;color:#7df9ff;margin-bottom:4px;letter-spacing:.04em}
.fuentes{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,180,255,.2);font-size:.75rem}
.fuentes a{display:block;color:#7df9ff;text-decoration:none;margin-bottom:4px;word-break:break-all}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:8px 10px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,8,16,.98) 20%);display:flex;gap:6px;align-items:center}
#input{flex:1;background:rgba(0,30,50,.9);border:1px solid rgba(0,200,255,.3);border-radius:22px;padding:11px 14px;color:#e0f7ff;font-size:.92rem;outline:none}
#input::placeholder{color:#4a7a8a}
button.icon{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
button.icon:active{transform:scale(.92)}
#btnSend{background:linear-gradient(145deg,#00b4e6,#0077aa);color:#fff}
#btnMic{background:linear-gradient(145deg,#00c9a0,#008866);color:#fff}
#btnMic.recording{background:linear-gradient(145deg,#ff4466,#cc2244);animation:pulse-fast .7s ease-in-out infinite}
#btnImg{background:linear-gradient(145deg,#7c5cff,#5a3fff);color:#fff}
#fileImg{display:none}
.hints{position:relative;z-index:2;flex-shrink:0;padding:0 10px 6px;display:flex;gap:6px;overflow-x:auto}
.hint{flex-shrink:0;font-size:.68rem;padding:4px 8px;border-radius:12px;border:1px solid rgba(0,180,255,.25);background:rgba(0,40,60,.5);color:#8ec8d8;cursor:pointer;white-space:nowrap}

/* COPILOTO FLOTANTE */
#copiloto{position:fixed;right:16px;bottom:82px;z-index:1000}
#copilotoBtn{width:58px;height:58px;border-radius:50%;border:1px solid rgba(0,220,255,.55);background:radial-gradient(circle at 35% 30%,#e0ffff,#00d4ff 35%,#0066aa 75%,#001428);box-shadow:0 0 15px #00e5ff,0 0 35px rgba(0,180,255,.65);color:#fff;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:copilotoPulse 2.5s ease-in-out infinite}
#copilotoBtn:active{transform:scale(.9)}
@keyframes copilotoPulse{0%,100%{box-shadow:0 0 15px #00e5ff,0 0 35px rgba(0,180,255,.65)}50%{box-shadow:0 0 25px #00e5ff,0 0 55px rgba(0,180,255,.8)}}
#copilotoPanel{position:absolute;right:0;bottom:70px;width:min(320px,calc(100vw - 30px));background:rgba(0,15,28,.96);border:1px solid rgba(0,210,255,.35);border-radius:18px;box-shadow:0 0 25px rgba(0,180,255,.3),0 15px 45px rgba(0,0,0,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden;display:none}
#copilotoPanel.abierto{display:block;animation:copilotoEntrada .2s ease-out}
@keyframes copilotoEntrada{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.copilotoHeader{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,200,255,.15)}
.copilotoTitulo{color:#7df9ff;font-size:.85rem;font-weight:700;letter-spacing:.08em}
.copilotoCerrar{background:transparent;border:none;color:#6f9eaa;font-size:1.1rem;cursor:pointer}
.copilotoContenido{padding:14px}
.copilotoTexto{color:#b9e9f4;font-size:.82rem;line-height:1.4;margin-bottom:12px}
.copilotoAcciones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.copilotoAccion{border:1px solid rgba(0,190,255,.25);background:rgba(0,60,85,.5);color:#9de8f5;border-radius:12px;padding:10px 8px;font-size:.75rem;cursor:pointer}
.copilotoAccion:active{transform:scale(.96);background:rgba(0,100,140,.6)}
@media(max-width:420px){#copiloto{right:12px;bottom:82px}#copilotoBtn{width:54px;height:54px}}
</style>
</head>
<body>
<div class="stars"></div>
<header><h1>YARVIS</h1><span id="estadoLabel">CALMADO</span></header>
<div class="core-wrap"><div class="core" id="core"></div></div>
<div class="status" id="status">Listo</div>
<div class="hints">
<span class="hint" data-cmd="/resumen">/resumen</span>
<span class="hint" data-cmd="/atlas "> /atlas</span>
<span class="hint" data-cmd="/code "> /code</span>
<span class="hint" data-cmd="/nova "> /nova</span>
<span class="hint" data-cmd="/lumen "> /lumen</span>
<span class="hint" data-cmd="/formal "> /formal</span>
<span class="hint" data-cmd="/casual "> /casual</span>
</div>
<div id="chat"></div>
<div id="copiloto">
  <button id="copilotoBtn" type="button" aria-label="Abrir copiloto">✦</button>

  <div id="copilotoPanel">
    <div class="copilotoHeader">
      <div class="copilotoTitulo">YARVIS · COPILOTO</div>
      <button class="copilotoCerrar" id="copilotoCerrar" type="button">✕</button>
    </div>

    <div class="copilotoContenido">
      <div class="copilotoTexto">
        ¿Qué quieres hacer?
      </div>

      <div class="copilotoAcciones">
        <button class="copilotoAccion" type="button" data-copiloto="nuevo">
          ＋ Nueva conversación
        </button>

        <button class="copilotoAccion" type="button" data-copiloto="memoria">
          🧠 Mi memoria
        </button>

        <button class="copilotoAccion" type="button" data-copiloto="notas">
          📝 Mis notas
        </button>

        <button class="copilotoAccion" type="button" data-copiloto="ayuda">
          ❓ Ayuda
        </button>
      </div>
    </div>
  </div>
</div>

<div class="bar">
  <button class="icon" id="btnMic" type="button" title="Hablar">🎤</button>

  <button class="icon" id="btnImg" type="button" title="Imagen">🖼️</button>

  <input id="fileImg" type="file" accept="image/*">

  <input
    id="input"
    type="text"
    placeholder="Escribe o habla..."
    autocomplete="off"
  >

  <button class="icon" id="btnSend" type="button" title="Enviar">➤</button>
</div>

<script>
(function () {
  'use strict';

  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var btnSend = document.getElementById('btnSend');
  var btnMic = document.getElementById('btnMic');
  var btnImg = document.getElementById('btnImg');
  var fileImg = document.getElementById('fileImg');
  var core = document.getElementById('core');
  var statusEl = document.getElementById('status');
  var estadoLabel = document.getElementById('estadoLabel');

  var sid = localStorage.getItem('yarvis_sid');

  if (!sid) {
    sid = Date.now() + '_' + Math.random().toString(36).slice(2);
    localStorage.setItem('yarvis_sid', sid);
  }

  var sessionId = 'web_' + sid;

  function setEstado(nombre, clase) {
    if (estadoLabel) {
      estadoLabel.textContent = nombre;
    }

    if (core) {
      core.classList.remove(
        'listening',
        'thinking',
        'speaking'
      );

      if (clase) {
        core.classList.add(clase);
      }
    }

    if (statusEl) {
      statusEl.textContent = nombre;
    }
  }

  function addMsg(text, who, agentName, fuentes) {
    if (!chat) return;

    var div = document.createElement('div');
    div.className = 'msg ' + who;

    if (agentName && who === 'bot') {
      var ag = document.createElement('span');
      ag.className = 'agent';
      ag.textContent = agentName;
      div.appendChild(ag);
    }

    div.appendChild(
      document.createTextNode(text || '')
    );

    if (fuentes && fuentes.length) {
      var box = document.createElement('div');
      box.className = 'fuentes';

      box.appendChild(
        document.createTextNode('Fuentes:')
      );

      fuentes.forEach(function (f, i) {
        var a = document.createElement('a');

        a.href = f.url || '#';
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent =
          (i + 1) + '. ' +
          (f.titulo || f.url || 'Fuente');

        box.appendChild(a);
      });

      div.appendChild(box);
    }

    chat.appendChild(div);

    setTimeout(function () {
      chat.scrollTop = chat.scrollHeight;
    }, 30);
  }

  function parseAgent(respuesta) {
    var m = String(respuesta || '').match(
      /^([A-Za-zÁÉÍÓÚáéíóúñÑ]+):\s*\n\n?([\s\S]*)$/
    );

    if (m) {
      return {
        agent: m[1],
        text: m[2].trim()
      };
    }

    return {
      agent: 'Yarvis',
      text: respuesta || ''
    };
  }

  async function enviar(texto, imagen, mimeType) {
    texto = String(texto || '').trim();

    if (!texto && !imagen) {
      return;
    }

    if (texto) {
      addMsg(texto, 'user');
    }

    if (imagen) {
      addMsg('[Imagen enviada]', 'user');
    }

    if (input) {
      input.value = '';
    }

    setEstado('PROCESANDO', 'thinking');

    try {
      var body = {
        mensaje: texto,
        sessionId: sessionId,
        userId: 'default'
      };

      if (imagen && mimeType) {
        body.imagen = imagen;
        body.mimeType = mimeType;
      }

      var res = await fetch('/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      var contenido = await res.text();

      var data;

      try {
        data = JSON.parse(contenido);
      } catch (errorJSON) {
        throw new Error(
          'El servidor no devolvió JSON válido.'
        );
      }

      if (!res.ok) {
        throw new Error(
          data.error || 'Error del servidor.'
        );
      }

      var parsed = parseAgent(
        data.respuesta || ''
      );

      addMsg(
        parsed.text,
        'bot',
        data.agente || parsed.agent,
        data.fuentes || []
      );

      setEstado('HABLANDO', 'speaking');

      await hablar(parsed.text);

      setEstado('CALMADO', null);

    } catch (error) {

      console.error('Error /chat:', error);

      addMsg(
        'Error: ' + error.message,
        'bot',
        'Sistema'
      );

      setEstado('CALMADO', null);
    }
  }

  async function hablar(texto) {
    if (!texto) return;

    try {
      var res = await fetch('/tts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          texto: texto.slice(0, 800)
        })
      });

      if (!res.ok) return;

      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      var audio = new Audio(url);

      await new Promise(function (resolve) {

        audio.onended = function () {
          URL.revokeObjectURL(url);
          resolve();
        };

        audio.onerror = function () {
          URL.revokeObjectURL(url);
          resolve();
        };

        audio.play().catch(function () {
          resolve();
        });

      });

    } catch (error) {
      console.warn('TTS no disponible:', error);
    }
  }

  if (btnSend) {
    btnSend.addEventListener(
      'click',
      function () {
        enviar(input ? input.value : '');
      }
    );
  }

  if (input) {
    input.addEventListener(
      'keydown',
      function (e) {

        if (e.key === 'Enter') {
          e.preventDefault();
          enviar(input.value);
        }

      }
    );
  }

  document.querySelectorAll('.hint').forEach(
    function (el) {

      el.addEventListener(
        'click',
        function () {

          if (!input) return;

          input.value =
            el.getAttribute('data-cmd') || '';

          input.focus();
        }
      );

    }
  );

  if (btnImg && fileImg) {

    btnImg.addEventListener(
      'click',
      function () {
        fileImg.click();
      }
    );

    fileImg.addEventListener(
      'change',
      function () {

        var file =
          fileImg.files &&
          fileImg.files[0];

        if (!file) return;

        var reader =
          new FileReader();

        reader.onload = function () {

          var result =
            String(reader.result || '');

          var partes =
            result.split(',');

          var base64 =
            partes[1] || '';

          var mime =
            file.type || 'image/jpeg';

          var texto =
            input && input.value.trim()
              ? input.value.trim()
              : 'Que ves en esta imagen?';

          enviar(
            texto,
            base64,
            mime
          );

          fileImg.value = '';
        };

        reader.readAsDataURL(file);
      }
    );
  }

  var mediaRecorder = null;
  var chunks = [];
  var recording = false;

  if (btnMic) {

    btnMic.addEventListener(
      'click',
      async function () {

        if (recording) {
          stopRec();
          return;
        }

        try {

          if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
          ) {
            throw new Error(
              'El navegador no permite usar el micrófono.'
            );
          }

          var stream =
            await navigator.mediaDevices.getUserMedia({
              audio: true
            });

          chunks = [];

          mediaRecorder =
            new MediaRecorder(stream);

          mediaRecorder.ondataavailable =
            function (e) {

              if (e.data && e.data.size > 0) {
                chunks.push(e.data);
              }

            };

          mediaRecorder.onstop =
            async function () {

              stream.getTracks()
                .forEach(function (track) {
                  track.stop();
                });

              var blob =
                new Blob(
                  chunks,
                  { type: 'audio/webm' }
                );

              await transcribir(blob);
            };

          mediaRecorder.start();

          recording = true;

          btnMic.classList.add(
            'recording'
          );

          setEstado(
            'ESCUCHANDO',
            'listening'
          );

        } catch (error) {

          console.error(
            'Error micrófono:',
            error
          );

          alert(
            'Permite el micrófono en el navegador.'
          );

          setEstado(
            'CALMADO',
            null
          );
        }
      }
    );
  }

  function stopRec() {

    if (
      mediaRecorder &&
      recording
    ) {

      mediaRecorder.stop();

      recording = false;

      if (btnMic) {
        btnMic.classList.remove(
          'recording'
        );
      }

      setEstado(
        'PROCESANDO',
        'thinking'
      );
    }
  }

  async function transcribir(blob) {

    try {

      var reader =
        new FileReader();

      var base64 =
        await new Promise(
          function (resolve, reject) {

            reader.onload = function () {

              var s =
                String(reader.result || '');

              resolve(
                s.split(',')[1] || ''
              );
            };

            reader.onerror = reject;

            reader.readAsDataURL(blob);
          }
        );

      var res =
        await fetch('/transcribe', {
          method: 'POST',
          headers: {
            'Content-Type':
              'application/json'
          },
          body: JSON.stringify({
            audio: base64,
            mimeType: 'audio/webm'
          })
        });

      var data =
        await res.json();

      if (!res.ok) {
        throw new Error(
          data.error ||
          'Error al transcribir.'
        );
      }

      var texto =
        String(data.texto || '').trim();

      if (!texto) {

        setEstado(
          'CALMADO',
          null
        );

        return;
      }

      await enviar(texto);

    } catch (error) {

      console.error(
        'Error transcripción:',
        error
      );

      addMsg(
        'Error de transcripción: ' +
        error.message,
        'bot',
        'Sistema'
      );

      setEstado(
        'CALMADO',
        null
      );
    }
  }

  var copiloto =
    document.getElementById('copiloto');

  var copilotoBtn =
    document.getElementById('copilotoBtn');

  var copilotoPanel =
    document.getElementById('copilotoPanel');

  var copilotoCerrar =
    document.getElementById('copilotoCerrar');

  if (copilotoBtn && copilotoPanel) {

    copilotoBtn.addEventListener(
      'click',
      function (e) {

        e.stopPropagation();

        copilotoPanel.classList.toggle(
          'abierto'
        );
      }
    );
  }

  if (copilotoCerrar) {

    copilotoCerrar.addEventListener(
      'click',
      function (e) {

        e.stopPropagation();

        if (copilotoPanel) {
          copilotoPanel.classList.remove(
            'abierto'
          );
        }
      }
    );
  }

  document
    .querySelectorAll('[data-copiloto]')
    .forEach(function (boton) {

      boton.addEventListener(
        'click',
        function () {

          var accion =
            boton.getAttribute(
              'data-copiloto'
            );

          if (accion === 'nuevo') {

            var confirmar =
              confirm(
                '¿Quieres comenzar una nueva conversación?'
              );

            if (!confirmar) return;

            chat.innerHTML = '';

            var nuevoSid =
              Date.now() +
              '_' +
              Math.random()
                .toString(36)
                .slice(2);

            localStorage.setItem(
              'yarvis_sid',
              nuevoSid
            );

            sessionId =
              'web_' + nuevoSid;

            addMsg(
              'Nueva conversación iniciada.',
              'bot',
              'Yarvis'
            );

          } else if (accion === 'memoria') {

            addMsg(
              'La memoria de Yarvis está disponible desde el servidor.',
              'bot',
              'Copiloto'
            );

          } else if (accion === 'notas') {

            addMsg(
              'Puedes guardar notas mediante la función de notas del servidor.',
              'bot',
              'Copiloto'
            );

          } else if (accion === 'ayuda') {

            addMsg(
              'Puedes escribir normalmente o utilizar /atlas, /code, /nova, /lumen, /resumen, /formal o /casual.',
              'bot',
              'Copiloto'
            );
          }

          if (copilotoPanel) {
            copilotoPanel.classList.remove(
              'abierto'
            );
          }
        }
      );
    });

  document.addEventListener(
    'click',
    function (e) {

      if (
        copiloto &&
        copilotoPanel &&
        !copiloto.contains(e.target)
      ) {

        copilotoPanel.classList.remove(
          'abierto'
        );
      }
    }
  );
<script>

  var btnMic = document.getElementById('btnMic');
  var btnImg = document.getElementById('btnImg');
  var fileImg = document.getElementById('fileImg');
  var core = document.getElementById('core');
  var statusEl = document.getElementById('status');
  var estadoLabel = document.getElementById('estadoLabel');

  var sid = localStorage.getItem('yarvis_sid');

  if (!sid) {
    sid = Date.now() + '_' + Math.random().toString(36).slice(2);

    if (statusEl) statusEl.textContent = nombre;

      core.classList.remove(

      if (clase) {
        core.classList.add(clase);
      }
    }
  }

    );

    if (fuentes && fuentes.length) {
      var box = document.createElement('div');
      box.className = 'fuentes';

      box.appendChild(
        document.createTextNode('Fuentes:')
      );

      fuentes.forEach(function (f, i) {
        var a = document.createElement('a');

        a.href = f.url || '#';
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent =
          (i + 1) + '. ' +
          (f.titulo || f.url || 'Fuente');

        box.appendChild(a);
      });

      div.appendChild(box);
    }

    chat.appendChild(div);

    setTimeout(function () {
      chat.scrollTop = chat.scrollHeight;
    }, 20);
  }

  function parseAgent(respuesta) {
    var texto = respuesta || '';

    var m = texto.match(
      /^([A-Za-zÁÉÍÓÚáéíóúñÑ]+):\s*\n\n?([\s\S]*)$/
    );

    if (m) {
      return {
        agent: m[1],
        text: m[2].trim()
      };
    }

    return {
      agent: 'Yarvis',
      text: texto
    };
  }

  async function enviar(texto, imagen, mimeType) {
    texto = (texto || '').trim();

    if (!texto && !imagen) return;

    if (texto) {
      addMsg(texto, 'user');
    }

    if (imagen) {
      addMsg('[Imagen enviada]', 'user');
    }

    input.value = '';

    setEstado('PROCESANDO', 'thinking');

    try {
      var body = {
        mensaje: texto,
        sessionId: sessionId,
        userId: localStorage.getItem(
          'yarvis_user_id'
        ) || 'default'
      };

      if (imagen) {
        body.imagen = imagen;
        body.mimeType =
          mimeType || 'image/jpeg';
      }

      var res = await fetch('/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      var data;

      try {
        data = await res.json();
      } catch (e) {
        throw new Error(
          'El servidor no devolvió una respuesta válida.'
        );
      }

      if (!res.ok) {
        throw new Error(
          data.error ||
          'Error del servidor: ' +
          res.status
        );
      }

      var parsed = parseAgent(
        data.respuesta || ''
      );

      addMsg(
        parsed.text,
        'bot',
        data.agente || parsed.agent,
        data.fuentes || []
      );

      setEstado(
        'HABLANDO',
        'speaking'
      );

      await hablar(parsed.text);

      setEstado(
        'CALMADO',
        null
      );

    } catch (error) {
      console.error(
        'Error enviando mensaje:',
        error
      );

      addMsg(
        'Error: ' +
        (error.message ||
          'No se pudo conectar con Yarvis.'),
        'bot',
        'Sistema'
      );

      setEstado(
        'CALMADO',
        null
      );
    }
  }

  async function hablar(texto) {
    if (!texto) return;

    try {
      var res = await fetch('/tts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          texto: texto.slice(0, 800)
        })
      });

      if (!res.ok) return;

      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      var audio = new Audio(url);

      await new Promise(function (resolve) {

        audio.onended = function () {
          URL.revokeObjectURL(url);
          resolve();
        };

        audio.onerror = function () {
          URL.revokeObjectURL(url);
          resolve();
        };

        var promesa = audio.play();

        if (promesa) {
          promesa.catch(function () {
            resolve();
          });
        }
      });

    } catch (e) {
      console.warn(
        'TTS no disponible:',
        e.message
      );
    }
  }

  if (btnSend) {
    btnSend.addEventListener(
      'click',
      function () {
        enviar(input.value);
      }
    );
  }

  if (input) {
    input.addEventListener(
      'keydown',
      function (e) {

        if (e.key === 'Enter') {
          e.preventDefault();
          enviar(input.value);
        }

      }
    );
  }

  document
    .querySelectorAll('.hint')
    .forEach(function (el) {

      el.addEventListener(
        'click',
        function () {

          input.value =
            el.getAttribute(
              'data-cmd'
            ) || '';

          input.focus();

        }
      );

    });

  if (btnImg && fileImg) {

    btnImg.addEventListener(
      'click',
      function () {
        fileImg.click();
      }
    );

    fileImg.addEventListener(
      'change',
      function () {

        var file =
          fileImg.files &&
          fileImg.files[0];

        if (!file) return;

        var reader =
          new FileReader();

        reader.onload = function () {

          var resultado =
            reader.result || '';

          var partes =
            resultado.split(',');

          var base64 =
            partes[1] || '';

          var mime =
            file.type ||
            'image/jpeg';

          var pregunta =
            input.value.trim() ||
            '¿Qué ves en esta imagen?';

          enviar(
            pregunta,
            base64,
            mime
          );

          fileImg.value = '';

        };

        reader.readAsDataURL(file);

      }
    );
  }

  var mediaRecorder = null;
  var chunks = [];
  var recording = false;

  if (btnMic) {

    btnMic.addEventListener(
      'click',
      async function () {

        if (recording) {
          detenerGrabacion();
          return;
        }

        try {

          if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
          ) {
            throw new Error(
              'El navegador no permite usar el micrófono.'
            );
          }

          var stream =
            await navigator.mediaDevices
              .getUserMedia({
                audio: true
              });

          chunks = [];

          var tipoAudio =
            'audio/webm';

          if (
            typeof MediaRecorder !==
            'undefined' &&
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(
              'audio/webm;codecs=opus'
            )
          ) {
            tipoAudio =
              'audio/webm;codecs=opus';
          }

          mediaRecorder =
            new MediaRecorder(
              stream,
              {
                mimeType: tipoAudio
              }
            );

          mediaRecorder.ondataavailable =
            function (e) {

              if (
                e.data &&
                e.data.size > 0
              ) {
                chunks.push(e.data);
              }

            };

          mediaRecorder.onstop =
            async function () {

              stream
                .getTracks()
                .forEach(function (track) {
                  track.stop();
                });

              var blob =
                new Blob(
                  chunks,
                  {
                    type: tipoAudio
                  }
                );

              await transcribir(blob);

            };

          mediaRecorder.start();

          recording = true;

          btnMic.classList.add(
            'recording'
          );

          setEstado(
            'ESCUCHANDO',
            'listening'
          );

        } catch (error) {

          console.error(
            'Error del micrófono:',
            error
          );

          alert(
            'Permite el micrófono en el navegador.'
          );

          setEstado(
            'CALMADO',
            null
          );

        }

      }
    );
  }

  function detenerGrabacion() {

    if (
      mediaRecorder &&
      recording
    ) {

      mediaRecorder.stop();

      recording = false;

      btnMic.classList.remove(
        'recording'
      );

      setEstado(
        'PROCESANDO',
        'thinking'
      );
    }
  }

  async function transcribir(blob) {

    try {

      var reader =
        new FileReader();

      var base64 =
        await new Promise(
          function (resolve, reject) {

            reader.onload =
              function () {

                var resultado =
                  reader.result || '';

                resolve(
                  resultado.split(',')[1] ||
                  resultado
                );

              };

            reader.onerror =
              reject;

            reader.readAsDataURL(blob);

          }
        );

      var res =
        await fetch(
          '/transcribe',
          {
            method: 'POST',
            headers: {
              'Content-Type':
                'application/json'
            },
            body: JSON.stringify({
              audio: base64,
              mimeType:
                'audio/webm'
            })
          }
        );

      var data =
        await res.json();

      if (!res.ok) {
        throw new Error(
          data.error ||
          'Error al transcribir.'
        );
      }

      var texto =
        (data.texto || '').trim();

      if (!texto) {

        addMsg(
          'No entendí el audio.',
          'bot',
          'Sistema'
        );

        setEstado(
          'CALMADO',
          null
        );

        return;
      }

      await enviar(texto);

    } catch (error) {

      console.error(
        'Error de transcripción:',
        error
      );

      addMsg(
        'Error de transcripción: ' +
        error.message,
        'bot',
        'Sistema'
      );

      setEstado(
        'CALMADO',
        null
      );
    }
  }
