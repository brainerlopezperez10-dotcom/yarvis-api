<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yarvis Copiloto Móvil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 18px; color: #38bdf8; letter-spacing: 1px; }
    .status { font-size: 11px; color: #4ade80; display: block; margin-top: 4px; }
    
    .chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .user { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 4px; }
    .yarvis { background: #334155; align-self: flex-start; border-bottom-left-radius: 4px; border-left: 4px solid #38bdf8; }
    
    .controls {
      background: #1e293b;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid #334155;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:active { background: #38bdf8; color: #0f172a; }
    button.active { background: #ef4444; border-color: #f87171; }

    .input-group {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    
    /* Video oculto para capturar el fotograma */
    video { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>🤖 YARVIS COPILOTO MÓVIL</h1>
    <span class="status">● ONLINE Y LISTO</span>
  </header>

  <div class="chat-container" id="chat">
    <div class="msg yarvis">¡Hola! Soy Yarvis. Puedes pedirme transmitir tu pantalla o hablarme por voz. ¿En qué te ayudo?</div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button id="btnPantalla" onclick="togglePantalla()">📷 Transmitir Pantalla</button>
      <button onclick="escucharVoz()">🎙️ Hablar</button>
    </div>
    <div class="input-group">
      <input type="text" id="mensajeInput" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') enviarMensaje()">
      <button style="flex:0 0 50px" onclick="enviarMensaje()">➤</button>
    </div>
  </div>

  <video id="videoScreen" autoplay playsinline></video>
  <canvas id="canvasScreen" style="display:none;"></canvas>

  <script>
    // SUSTITUYE ESTA URL POR LA DE TU SERVIDOR EN RENDER:
    const API_URL = "https://yarvis-api.onrender.com"; 

    const chat = document.getElementById('chat');
    const video = document.getElementById('videoScreen');
    const canvas = document.getElementById('canvasScreen');
    let screenStream = null;

    function agregarMensaje(texto, emisor) {
      const div = document.createElement('div');
      div.className = `msg ${emisor}`;
      div.innerText = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Hablar con la voz del celular
    function hablar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        window.speechSynthesis.speak(utterance);
      }
    }

    // Reconocimiento de voz por micrófono en celular
    function escucharVoz() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Tu celular no soporta reconocimiento de voz.");

      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      agregarMensaje("Escuchando...", "yarvis");

      recognition.onresult = (event) => {
        const texto = event.results[0][0].transcript;
        document.getElementById('mensajeInput').value = texto;
        enviarMensaje();
      };

      recognition.start();
    }

    // Iniciar o detener la captura de pantalla en celular
    async function togglePantalla() {
      const btn = document.getElementById('btnPantalla');

      if (!screenStream) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: "browser" }
          });
          video.srcObject = screenStream;
          btn.innerText = "🛑 Detener Pantalla";
          btn.classList.add('active');
          agregarMensaje("Pantalla vinculada. Ahora Yarvis puede ver lo que haces.", "yarvis");
        } catch (err) {
          alert("No se pudo compartir la pantalla o se canceló.");
        }
      } else {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
        btn.innerText = "📷 Transmitir Pantalla";
        btn.classList.remove('active');
        agregarMensaje("Se detuvo la transmisión de pantalla.", "yarvis");
      }
    }

    // Obtener imagen en Base64 de la pantalla transmitida
    function capturarFotograma() {
      if (!screenStream) return null;
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/png');
    }

    async function enviarMensaje() {
      const input = document.getElementById('mensajeInput');
      const texto = input.value.trim();
      if (!texto && !screenStream) return;

      input.value = '';
      if (texto) agregarMensaje(texto, 'user');

      const capturaBase64 = capturarFotograma();

      try {
        let endpoint = `${API_URL}/chat`;
        let bodyData = { mensaje: texto };

        // Si hay una pantalla activa, usamos la ruta visual
        if (capturaBase64) {
          endpoint = `${API_URL}/chat-vision`;
          bodyData = {
            mensaje: texto || "¿Qué ves en mi pantalla y qué me recomiendas hacer?",
            imagenBase64: capturaBase64
          };
        }

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await res.json();
        const respuesta = data.respuesta || data.error;

        agregarMensaje(respuesta, 'yarvis');
        hablar(respuesta);

      } catch (e) {
        agregarMensaje("Error conectando con Yarvis.", 'yarvis');
      }
    }
  </script>
</body>
</html>
